version: '3.8'
services:
  app:
    build: ./app
    container_name: vulnerable-app
    expose:
      - "5000"
    networks:
      - backend

  cache:
    image: nginx:alpine
    container_name: cache-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend

networks:
  backend: