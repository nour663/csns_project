version: '3.8'

services:

  flask:
    build: ./app
    container_name: flask_app
    ports:
      - "5000:5000"
    networks:
      - app_net

  nginx:
    image: nginx:latest
    container_name: nginx_cache
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    networks:
      - app_net

networks:
  app_net:
    driver: bridge