events {}

http {
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        proxy_cache_key "$scheme$request_method$host$request_uri";

        # ----------------------------------------------------------------
        # FIX #1 (Cache Poisoning): never forward the client-supplied
        # X-Forwarded-Host value. Only forward the host nginx itself
        # resolved ($host), which the client cannot control. The app no
        # longer has an attacker-controlled value to reflect into HTML.
        # ----------------------------------------------------------------

        # Auth / sensitive routes — never cached, never shared
        location ~ ^/(login|account|logout) {
            proxy_pass http://flask:5000;

            # FIX #2 (Cache Deception): explicitly disable caching and
            # tell any downstream cache (browser, CDN, this proxy) never
            # to store the response.
            proxy_cache off;
            add_header Cache-Control "private, no-store" always;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;   # trusted value only
        }

        # Cacheable, non-sensitive routes
        location / {
            proxy_pass http://flask:5000;
            proxy_cache my_cache;
            proxy_cache_valid 200 302 5m;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;   # trusted value only

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By "nginx-cache-demo-fixed";

            # Respect real Cache-Control/Expires from upstream instead of
            # ignoring them — the original lab discarded these on purpose
            # to make poisoning persist.
            proxy_cache_lock on;
        }

        # ----------------------------------------------------------------
        # FIX #3 (Cache Deception / path confusion): the vulnerable config
        # had an exact-match location for /account/profile.css that cached
        # a sensitive response. That location is removed entirely. Any
        # request under /account/* — including /account/x.css,
        # /account/photo.jpg, etc. — now falls through to the regex
        # location above, which forces proxy_cache off and
        # Cache-Control: private, no-store. There is no location block
        # anywhere that caches anything under /account.
        # ----------------------------------------------------------------
    }
}
