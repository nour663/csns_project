version: '3.8'

services:

  flask:
    build: ./app
    container_name: flask_app_fixed
    environment:
      - CANONICAL_HOST=localhost:8080
      - SECRET_KEY=change-me-in-real-deploys
    ports:
      - "5000:5000"
    networks:
      - app_net

  nginx:
    image: nginx:latest
    container_name: nginx_cache_fixed
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
