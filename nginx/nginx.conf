events {}

http {
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # VULNERABLE cache key — does NOT include X-Forwarded-Host
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Auth routes — no caching
        location ~ ^/(login|account|logout) {
            proxy_pass http://flask:5000;
            proxy_cache off;
            proxy_set_header Host $host;
            # Pass X-Forwarded-Host as-is from the client
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        # Cacheable routes — poisoning targets
        location / {
            proxy_pass http://flask:5000;
            proxy_cache my_cache;
            proxy_cache_valid 200 302 5m;

            proxy_set_header Host $host;
            # KEY: pass X-Forwarded-Host directly from client request
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

            # Show cache status
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By "nginx-cache-demo";

            # Ignore cache control headers so poisoning persists
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Set-Cookie;
        }
    }
}