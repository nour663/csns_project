events {}

http {
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Do NOT cache login, account, logout (dynamic/auth routes)
        location ~ ^/(login|account|logout) {
            proxy_pass http://flask:5000;
            proxy_cache off;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Host $host;
            add_header X-Cache-Status "BYPASS (auth route)";
        }

        # Cache everything else (home, static-page — these are the poisoning targets)
        location / {
            proxy_pass http://flask:5000;
            proxy_cache my_cache;
            proxy_cache_valid 200 5m;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Host $host;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By "nginx-cache-demo";
            proxy_ignore_headers Cache-Control;
            proxy_ignore_headers Set-Cookie;
        }
    }
}